<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Darshan - Portfolio</title>
    <!--
      GitHub Pages SPA fallback (rafgraph/spa-github-pages).
      GitHub Pages returns this file for any path it can't find. The script
      rewrites the path into a query string and redirects to the app root,
      where the snippet in index.html restores the real URL.

      pathSegmentsToKeep:
        0  -> user site   (https://<user>.github.io)
        1  -> project site (https://<user>.github.io/<repo>/)   <-- also set base in vite.config.js
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
