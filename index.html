    <!-- GitHub Pages SPA redirect (rafgraph/spa-github-pages). Restores the
         real URL after 404.html bounces a deep link back to index.html, so
         refreshing /projects (etc.) works without a server. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Prerender.io for social media crawlers -->
